
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kendinizi Okulla Konumlandırın</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');

:root{
 --wine:#642b38;
 --dark:#321b20;
 --cream:#f4ead9;
 --paper:#fff9ed;
 --gold:#b28a4d;
 --ink:#49352f;
}

*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 background:
 radial-gradient(ellipse at top,#76505a,#291b20 75%);
 color:var(--ink);
 font-family:'Cormorant Garamond',serif;
}

button,input,textarea{font:inherit}

button{cursor:pointer}

.hidden{display:none!important}

/* GİRİŞ */

#login{
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:25px;
}

.login-card{
 width:100%;
 max-width:430px;
 background:var(--cream);
 padding:45px 30px;
 text-align:center;
 border:1px solid var(--gold);
 outline:5px solid rgba(178,138,77,.16);
 box-shadow:0 25px 80px #0008;
}

.login-card h1{
 font-family:'Playfair Display',serif;
 color:var(--wine);
 font-size:35px;
 font-weight:400;
}

.login-card p{font-size:19px}

.login-card select{
 width:100%;
 padding:14px;
 background:var(--paper);
 border:1px solid var(--gold);
 color:var(--ink);
 font-size:18px;
}

.main-btn{
 background:var(--wine);
 color:var(--cream);
 border:1px solid var(--gold);
 padding:13px 24px;
 margin-top:20px;
 font-size:19px;
 transition:.3s;
}

.main-btn:hover{background:var(--dark)}

/* KARŞILAMA */

#welcome{
 position:fixed;
 inset:0;
 z-index:20;
 background:var(--dark);
 color:var(--cream);
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 padding:25px;
 animation:fadeIn .8s;
}

#welcome h1{
 font-family:'Playfair Display',serif;
 font-size:clamp(32px,7vw,58px);
 font-weight:400;
 color:#e6c58e;
 animation:rise 1.3s;
}

#welcome p{font-size:22px}

@keyframes fadeIn{
 from{opacity:0}to{opacity:1}
}

@keyframes rise{
 from{opacity:0;transform:translateY(25px)}
 to{opacity:1;transform:translateY(0)}
}

/* KİTAP */

#app{
 min-height:100vh;
 padding:25px 15px 45px;
}

.topbar{
 max-width:1000px;
 margin:0 auto 20px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 color:var(--cream);
}

.topbar button{
 border:1px solid var(--gold);
 background:transparent;
 color:var(--cream);
 padding:9px 13px;
}

.book-wrap{
 max-width:900px;
 margin:auto;
 perspective:1600px;
}

.book{
 min-height:570px;
 display:grid;
 grid-template-columns:190px 1fr;
 background:var(--paper);
 border:1px solid var(--gold);
 box-shadow:0 25px 65px #0008;
 position:relative;
}

.spine{
 background:linear-gradient(90deg,#32151e,#743a47,#4a222c);
 color:#e8c99b;
 display:flex;
 align-items:center;
 justify-content:center;
 writing-mode:vertical-rl;
 transform:rotate(180deg);
 font-family:'Playfair Display',serif;
 letter-spacing:4px;
 font-size:23px;
 padding:20px;
 border-right:4px solid #a67b47;
}

.page{
 padding:45px clamp(20px,6vw,65px);
 min-width:0;
 display:flex;
 flex-direction:column;
 position:relative;
 background:
 repeating-linear-gradient(
  0deg,
  transparent,
  transparent 31px,
  rgba(100,43,56,.035) 32px
 ),var(--paper);
}

.page-number{
 text-align:center;
 color:var(--gold);
 font-size:15px;
 margin-bottom:15px;
}

.page h2{
 font-family:'Playfair Display',serif;
 color:var(--wine);
 font-size:clamp(28px,5vw,39px);
 font-weight:400;
 text-align:center;
 margin:5px 0 25px;
}

.page-content{
 font-size:23px;
 line-height:1.65;
 white-space:pre-wrap;
 min-height:180px;
}

.page-controls{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 margin-top:auto;
 padding-top:35px;
}

.page-controls button{
 background:var(--wine);
 color:var(--cream);
 border:1px solid var(--gold);
 padding:11px 20px;
}

.page-controls button:disabled{
 opacity:.35;
 cursor:not-allowed;
}

.page-count{
 color:var(--gold);
 font-size:17px;
}

/* YÖNETİCİ */

#adminPanel{
 max-width:900px;
 margin:25px auto;
 padding:25px;
 background:var(--cream);
 border:1px solid var(--gold);
 box-shadow:0 10px 35px #0005;
}

#adminPanel h2{
 color:var(--wine);
 font-family:'Playfair Display',serif;
 font-weight:400;
}

#editTitle,#editText{
 width:100%;
 padding:13px;
 margin:8px 0 15px;
 border:1px solid #b9a17e;
 background:var(--paper);
 color:var(--ink);
 font-size:18px;
}

#editText{
 min-height:180px;
 resize:vertical;
}

.admin-actions{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
}

.admin-actions button{
 background:var(--wine);
 color:white;
 border:0;
 padding:12px 18px;
}

.admin-note{
 font-size:16px;
 color:#765c51;
}

@media(max-width:600px){
 #app{padding:12px 9px 30px}
 .book{grid-template-columns:38px 1fr;min-height:580px}
 .spine{font-size:12px;letter-spacing:2px;padding:8px}
 .page{padding:28px 18px}
 .page-content{font-size:20px}
 .page-controls button{padding:10px 13px}
 .topbar{font-size:14px}
}

</style>
</head>

<body>

<!-- GİRİŞ -->
<section id="login">
 <div class="login-card">
  <div style="color:var(--gold);font-size:30px">✦</div>
  <h1>Kendinizi Okulla Konumlandırın</h1>
  <p>Bu kitabın hangi sayfasından başlayacaksın?</p>

  <select id="identity">
   <option value="skawrax">skawrax</option>
   <option value="skawraxia">skawraxia</option>
  </select>

  <br>
  <button class="main-btn" onclick="login()">Kitabı Aç</button>
  <p style="font-size:14px;color:#927b66;margin-top:25px">
   Sana ayrılmış küçük bir dünya.
  </p>
 </div>
</section>

<!-- KARŞILAMA -->
<section id="welcome" class="hidden">
 <div>
  <div style="font-size:38px;color:#d5b47d">✧</div>
  <h1 id="welcomeTitle">Hoş geldin!</h1>
  <p id="welcomeText"></p>
 </div>
</section>

<!-- ANA SİTE -->
<main id="app" class="hidden">

 <div class="topbar">
  <span id="userLabel">Kitap</span>
  <div>
   <button onclick="toggleFullscreen()">⛶ Büyüt</button>
   <button onclick="logout()">Çıkış</button>
  </div>
 </div>

 <div class="book-wrap">
  <div class="book">
   <aside class="spine">
    KENDİNİZİ OKULLA KONUMLANDIRIN
   </aside>

   <section class="page">
    <div class="page-number">ÖZEL BİR KİTAP · 2026</div>
    <h2 id="pageTitle"></h2>
    <div class="page-content" id="pageContent"></div>

    <div class="page-controls">
     <button id="prevBtn" onclick="changePage(-1)">← Önceki</button>
     <span class="page-count" id="pageCount"></span>
     <button id="nextBtn" onclick="changePage(1)">Sonraki →</button>
    </div>
   </section>
  </div>
 </div>

 <!-- YÖNETİCİ DÜZENLEME -->
 <section id="adminPanel" class="hidden">
  <h2>✦ Yönetici Masası</h2>
  <p class="admin-note">
   Burada yaptığın değişiklikler bu tarayıcıda kaydedilir.
  </p>

  <label>Sayfa başlığı</label>
  <input id="editTitle" type="text">

  <label>Sayfa içeriği</label>
  <textarea id="editText"></textarea>

  <div class="admin-actions">
   <button onclick="savePage()">Değişiklikleri Kaydet</button>
   <button onclick="resetPage()">Sayfayı İlk Hâline Döndür</button>
  </div>
 </section>

</main>

<script>

const originalPages = [
 {
  title:"Kendinizi Okulla Konumlandırın",
  text:"Bazı kitaplar okunmak için değil, hissedilmek için yazılır.\n\nBu kitap da bizim hikâyemizin küçük bir parçası..."
 },
 {
  title:"Yoklama",
  text:"28 Kasım 2025.\n\nİlk günden bugüne, her gün yeniden seni seçiyorum.\n\nBugün de seni seviyorum."
 },
 {
  title:"İlk Ders",
  text:"Bana öğrettiğin ilk şeyleri belki hatırlamıyorsun.\n\nAma ben hayatıma kattığın her güzel şeyi hatırlıyorum."
 },
 {
  title:"Anı Defteri",
  text:"Buraya birlikte biriktirdiğimiz anılar gelecek.\n\nFotoğraflarımız, küçük notlarımız ve unutmak istemediğimiz günler..."
 },
 {
  title:"Ders Notları",
  text:"Bazen bir cümle, koca bir günü güzelleştirir.\n\nBuraya aklımda kalan cümleleri yazacağım."
 },
 {
  title:"Sınav Sorusu",
  text:"Soru: Bir insanın hayatına kattığı güzellikler nasıl ölçülür?\n\nCevap: Bazı şeylerin cevabı yoktur. Sadece hissedilir."
 },
 {
  title:"Mezuniyet Yok",
  text:"Bu dersin mezuniyeti yok.\n\nÇünkü senden öğreneceklerim, birlikte yaşayacağımız şeyler hiç bitmesin istiyorum."
 },
 {
  title:"Son Ders",
  text:"Öğretmenler Günün kutlu olsun.\n\nBana öğrettiğin her şey için, hayatıma kattığın bütün güzellikler için teşekkür ederim.\n\nİyi ki varsın."
 }
];

let pages = JSON.parse(localStorage.getItem("bookPages")) || originalPages.map(p=>({...p}));
let currentPage=0;
let isAdmin=false;

function login(){
 const id=document.getElementById("identity").value;
 isAdmin=(id==="skawraxia");

 document.getElementById("login").classList.add("hidden");
 document.getElementById("welcome").classList.remove("hidden");

 if(isAdmin){
  document.getElementById("welcomeTitle").textContent="Hoş geldin yönetici!";
  document.getElementById("welcomeText").textContent="Kitabın sayfaları seni bekliyor.";
 }else{
  document.getElementById("welcomeTitle").textContent="Hoş geldin sevgilimmmm!";
  document.getElementById("welcomeText").textContent="Senin için hazırlanmış küçük bir dünya...";
 }

 setTimeout(()=>{
  document.getElementById("welcome").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("userLabel").textContent=id;
  document.getElementById("adminPanel").classList.toggle("hidden",!isAdmin);
  currentPage=0;
  renderPage();
 },2500);
}

function renderPage(){
 const p=pages[currentPage];

 document.getElementById("pageTitle").textContent=p.title;
 document.getElementById("pageContent").textContent=p.text;
 document.getElementById("pageCount").textContent=
  `${currentPage+1} / ${pages.length}`;

 document.getElementById("prevBtn").disabled=currentPage===0;
 document.getElementById("nextBtn").disabled=currentPage===pages.length-1;

 if(isAdmin){
  document.getElementById("editTitle").value=p.title;
  document.getElementById("editText").value=p.text;
 }
}

function changePage(direction){
 const next=currentPage+direction;
 if(next<0 || next>=pages.length)return;
 currentPage=next;
 renderPage();
}

function savePage(){
 if(!isAdmin)return;

 pages[currentPage]={
  title:document.getElementById("editTitle").value,
  text:document.getElementById("editText").value
 };

 localStorage.setItem("bookPages",JSON.stringify(pages));
 renderPage();
 alert("Sayfa kaydedildi!");
}

function resetPage(){
 if(!isAdmin)return;
 if(!confirm("Bu sayfayı ilk hâline döndürmek istiyor musun?"))return;

 pages[currentPage]={...originalPages[currentPage]};
 localStorage.setItem("bookPages",JSON.stringify(pages));
 renderPage();
}

function logout(){
 document.getElementById("app").classList.add("hidden");
 document.getElementById("login").classList.remove("hidden");
 document.getElementById("identity").value="skawrax";
}

function toggleFullscreen(){
 if(!document.fullscreenElement){
  document.documentElement.requestFullscreen?.();
 }else{
  document.exitFullscreen?.();
}

}

</script>
</body>
</html>
